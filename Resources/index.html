<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickText</title>
  <!-- STYLESHEET_PLACEHOLDER -->
</head>
<body>
  <div id="window-frame">
    <header id="title-bar">
      <span class="title-text">QuickText</span>
      <div style="display: flex; gap: 6px;">
        <button id="clear-btn" class="btn" style="background: rgba(255, 255, 255, 0.02); border-color: rgba(255, 255, 255, 0.05); color: #A0A0A5;">Clear</button>
        <button id="copy-btn" class="btn">Copy</button>
        <button id="close-btn" class="btn" style="background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.2); color: #FF6B6B;">Close</button>
      </div>
    </header>
    <main id="content">
      <textarea id="pad" placeholder="Start typing notes..." autofocus></textarea>
      <footer id="link-bar" style="display: none;"></footer>
    </main>
  </div>
  <div id="measurer" style="position: absolute; visibility: hidden; white-space: pre-wrap; word-wrap: break-word; font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; line-height: 1.5; padding-right: 18px; box-sizing: border-box; width: 576px; top: 0; left: 0; z-index: -100;"></div>
  <!-- SCRIPT_PLACEHOLDER -->
</body>
</html>
