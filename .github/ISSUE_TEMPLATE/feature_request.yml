name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        QuickText is deliberately small (one plain-text note, low memory use). Please check that your idea fits that, see CONTRIBUTING.md.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What do you have in mind?
