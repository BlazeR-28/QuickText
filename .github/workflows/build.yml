name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build (Debug and Release, warnings are errors)
        run: |
          dotnet build QuickText.sln -c Debug --nologo -warnaserror
          dotnet build QuickText.sln -c Release --nologo -warnaserror
