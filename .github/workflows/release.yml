name: Release

# Push a tag such as v2.0.0 and this builds both variants and attaches them to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Runs on any Windows 10/11 without installing anything (about 120 MB).
      - name: Publish self-contained
        run: dotnet publish -c Release -o out/full --nologo

      # Tiny (about 0.2 MB), needs the .NET 10 Desktop Runtime.
      - name: Publish framework-dependent
        run: dotnet publish -c Release -p:SelfContained=false -o out/small --nologo

      - name: Collect assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out/full/QuickText.exe dist/QuickText.exe
          Copy-Item out/small/QuickText.exe dist/QuickText-needs-dotnet.exe
          Get-ChildItem dist | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --title "QuickText ${{ github.ref_name }}" --generate-notes
